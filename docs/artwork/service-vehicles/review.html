<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Working ON IT! vehicle candidates</title><style>body{margin:24px;background:#1d2f30;color:#e7e8d8;font:18px system-ui}h1{font-size:26px}label{display:block;margin:18px 0}select{font:inherit}main{display:flex;flex-wrap:wrap;gap:18px}.card{padding:16px;background:#2e3d40;width:230px}.view{display:flex;align-items:center;gap:18px;min-height:110px}.view span{width:24px}img{image-rendering:pixelated;object-fit:contain}p{max-width:820px;line-height:1.5}</style><h1>Working ON IT! emergency vehicle candidates</h1><p>Police patrol car, EMS ambulance, and fire engine beside the current civilian car. Approved September 9, 2026 and installed in the game. North shows the rear; south shows the front.</p><label>Pixel scale <select id="scale"><option value="1">Native</option><option value="2">2×</option><option value="3" selected>3×</option><option value="4">4×</option></select></label><main id="cards"></main><script>const kinds=[['civilian','Existing civilian'],['police','Police'],['ems','Ambulance / EMS'],['fire','Fire engine']];const cards=document.querySelector('#cards');for(const[kind,title]of kinds){const card=document.createElement('section');card.className='card';card.innerHTML='<h2>'+title+'</h2>';for(const v of ['E','W','S','N']){const row=document.createElement('div');row.className='view';row.innerHTML='<span>'+v+'</span><img alt="'+title+' '+v+'" src="'+(kind==='civilian'?'current-civilian':kind)+'-'+v+'.png" data-width="'+('EW'.includes(v)?36:22)+'" data-height="'+('EW'.includes(v)?24:29)+'">';card.append(row);}cards.append(card);}function resize(){const n=Number(document.querySelector('#scale').value);document.querySelectorAll('img').forEach(im=>{im.width=im.dataset.width*n;im.height=im.dataset.height*n;});}document.querySelector('#scale').onchange=resize;resize();</script></html>
